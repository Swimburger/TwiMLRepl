<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f15"/>
      <stop offset="1" stop-color="#182230"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#d91f3a" stop-opacity=".38"/>
      <stop offset="1" stop-color="#d91f3a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g fill="#fff" opacity=".045">
    <circle cx="48" cy="40" r="2"/><circle cx="88" cy="40" r="2"/><circle cx="128" cy="40" r="2"/><circle cx="168" cy="40" r="2"/><circle cx="208" cy="40" r="2"/>
    <circle cx="48" cy="80" r="2"/><circle cx="88" cy="80" r="2"/><circle cx="128" cy="80" r="2"/><circle cx="168" cy="80" r="2"/><circle cx="208" cy="80" r="2"/>
  </g>
  <g transform="translate(88 74)">
    <rect width="58" height="58" rx="14" fill="#d91f3a"/>
    <path d="m25 16-11 13 11 13m8-26 11 13-11 13" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="44" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="1">TWIML C# REPL</text>
  </g>
  <text x="88" y="216" fill="#fff" font-family="Arial, sans-serif" font-size="66" font-weight="700">Write C#. Generate TwiML.</text>
  <text x="88" y="270" fill="#aeb8c6" font-family="Arial, sans-serif" font-size="28">Compile and inspect Voice or Messaging TwiML locally in your browser.</text>
  <g transform="translate(88 318)" filter="url(#shadow)">
    <rect width="1024" height="204" rx="18" fill="#111821" stroke="#344155" stroke-width="2"/>
    <path d="M512 0v204" stroke="#344155" stroke-width="2"/>
    <rect width="512" height="42" rx="18" fill="#182230"/>
    <path d="M0 42h512" stroke="#344155"/>
    <rect x="512" width="512" height="42" rx="18" fill="#182230"/>
    <path d="M512 42h512" stroke="#344155"/>
    <text x="22" y="28" fill="#aeb8c6" font-family="Arial, sans-serif" font-size="16" font-weight="700">C# INPUT</text>
    <text x="534" y="28" fill="#aeb8c6" font-family="Arial, sans-serif" font-size="16" font-weight="700">TWIML OUTPUT</text>
    <g font-family="Consolas, monospace" font-size="20">
      <text x="24" y="82" fill="#82d6aa">var response = new VoiceResponse();</text>
      <text x="24" y="116" fill="#edf1f6">response.Say(<tspan fill="#f3cb70">"Hello from TwiML"</tspan>);</text>
      <text x="24" y="150" fill="#82d6aa">return response;</text>
      <text x="536" y="82" fill="#8bc7ff">&lt;?xml version="1.0"?&gt;</text>
      <text x="536" y="116" fill="#edf1f6">&lt;Response&gt;</text>
      <text x="556" y="150" fill="#f3cb70">&lt;Say&gt;Hello from TwiML&lt;/Say&gt;</text>
      <text x="536" y="184" fill="#edf1f6">&lt;/Response&gt;</text>
    </g>
  </g>
  <text x="88" y="580" fill="#ff6b7f" font-family="Arial, sans-serif" font-size="22" font-weight="700">twiml.swimburger.net</text>
  <text x="1112" y="580" fill="#aeb8c6" font-family="Arial, sans-serif" font-size="20" text-anchor="end">Runs locally · No code uploads</text>
</svg>
