packages:
  - .

allowBuilds:
  esbuild: true
  workerd: true

# These exact versions were reviewed as part of the Cloudflare migration.
# Keep the release-age quarantine enabled for every future dependency update.
minimumReleaseAgeExclude:
  - '@cloudflare/workers-utils@0.57.0'
  - 'cf@1.0.0-rc.4'
  - 'miniflare@5.20261123.0-beta'
  - 'wrangler@4.167.0'
